              - paragraph [ref=f1e77]: Identité visuelle essentielle + Vitrine, avec 5 templates Instagram et une carte de visite.
              - list [ref=f1e78]:
                - listitem [ref=f1e79]: Logo + variantes, palette, typos, mini‑guide PDF
                - listitem [ref=f1e80]: Site Vitrine (cf. ci‑dessus)
