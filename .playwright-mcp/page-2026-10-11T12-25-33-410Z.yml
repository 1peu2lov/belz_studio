                - listitem [ref=f1e68]: 4 à 6 pages (services/tarifs, à propos, réalisations, contact…)
                - listitem [ref=f1e69]: Interface d’édition (horaires, tarifs, actus, galerie)
                - listitem [ref=f1e70]: 1 h de formation, SEO local par page
