                - paragraph [ref=f1e51]: "1 190 – 1 400 € HT (lancement : 990 €)"
              - paragraph [ref=f1e52]: One‑page codée, claire et efficace pour être trouvé sur Google et réservé en un clic.
              - list [ref=f1e53]:
                - listitem [ref=f1e54]: Sections essentielles (horaires, tarifs, carte, avis, contact)
                - listitem [ref=f1e55]: Intégration d’un outil de réservation (Planity, Cal.com…)
                - listitem [ref=f1e56]: Création/optimisation de la fiche Google Business Profile
                - listitem [ref=f1e57]: SEO local technique, mentions légales, mise en ligne
                - listitem [ref=f1e58]: 1 série de retours + 1 ajustement final
