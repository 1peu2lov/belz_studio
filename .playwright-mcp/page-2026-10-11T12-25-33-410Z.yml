        - generic [ref=f1e21]:
          - heading "Services" [level=1] [ref=f1e22]
          - paragraph [ref=f1e23]: Des sites codés à la main pour les indépendants et les petites entreprises. Je conçois votre identité et votre site, du premier croquis à la mise en ligne.
        - region [ref=f1e24]:
          - heading "Votre savoir-faire mérite de se voir." [level=2] [ref=f1e26]
          - list [ref=f1e27]:
            - listitem [ref=f1e28]:
              - heading "Sites web sur mesure" [level=3] [ref=f1e29]
              - paragraph [ref=f1e30]: Un site qui donne envie de découvrir votre activité et facilite la prise de contact. Je conçois et développe votre site autour de vos contenus, de votre identité et des besoins de vos visiteurs, sur ordinateur comme sur mobile.
            - listitem [ref=f1e31]:
              - heading "Web design" [level=3] [ref=f1e32]
              - paragraph [ref=f1e33]: Donner du caractère à votre site tout en rendant la navigation naturelle. Je travaille les maquettes, l’organisation des contenus et les interactions pour que vos visiteurs trouvent facilement ce qu’ils cherchent.
            - listitem [ref=f1e34]:
              - heading "Identité visuelle" [level=3] [ref=f1e35]
              - paragraph [ref=f1e36]: "Mettre une image sur ce qui rend votre projet unique. Logo, couleurs, typographies : je crée un univers visuel que vous pouvez vous approprier et faire vivre sur tous vos supports."
            - listitem [ref=f1e37]:
              - heading "Supports de communication" [level=3] [ref=f1e38]
              - paragraph [ref=f1e39]: "Prolonger votre univers au‑delà du site. Templates Instagram, cartes de visite, flyers ou visuels numériques : des supports cohérents avec votre identité, pensés pour vos usages au quotidien."
            - listitem [ref=f1e40]:
              - heading "Maintenance & accompagnement" [level=3] [ref=f1e41]
              - paragraph [ref=f1e42]: Un projet continue de vivre après sa mise en ligne. Je peux vous aider à entretenir votre site, faire évoluer ses contenus ou ajouter de nouvelles pages selon vos besoins.
        - region [ref=f1e43]:
          - generic [ref=f1e44]:
            - heading "Offres et tarifs" [level=2] [ref=f1e45]
            - paragraph [ref=f1e46]: Des forfaits clairs et adaptés aux TPE, avec des prix "à partir de". L’offre de lancement est réservée aux 5 premiers clients, en échange d’un témoignage et d’un avis Google.
