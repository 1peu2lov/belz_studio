              - paragraph [ref=f1e88]: "Sur‑mesure créatif : direction artistique poussée, motion, 3D/WebGL, vidéo. E‑commerce codé possible."
              - list [ref=f1e89]:
                - listitem [ref=f1e90]: Conception créative avancée (motion, micro‑interactions, 3D selon besoin)
                - listitem [ref=f1e91]: Développement Next.js + CMS
                - listitem [ref=f1e92]: Fonctionnalités spécifiques sur devis (ex. e‑commerce headless)
              - link "Parler de Signature" [ref=f1e94] [cursor=pointer]:
