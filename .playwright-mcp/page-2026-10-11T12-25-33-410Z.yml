                - heading "À la demande" [level=3] [ref=f1e142]
                - paragraph [ref=f1e143]: "60 € HT / h (pack 5 h : 270 €)"
              - list [ref=f1e144]:
                - listitem [ref=f1e145]: Pour les clients sans abonnement
          - paragraph [ref=f1e146]: Engagement de 3 mois minimum, puis résiliable chaque mois. Les heures non utilisées ne sont pas reportées. Frais tiers (domaine, Planity, Cal.com…) à la charge du client et à son nom.
        - region [ref=f1e147]:
          - heading "Questions fréquentes" [level=2] [ref=f1e149]
          - list [ref=f1e150]:
            - listitem [ref=f1e151]:
              - heading "Pourrai‑je modifier moi‑même le site ?" [level=3] [ref=f1e152]
              - paragraph [ref=f1e153]: "Oui, de deux façons : une interface d’édition simple (horaires, tarifs, actualités, galerie) ou, plus simplement, vous m’envoyez vos changements et je les applique (inclus dans la maintenance Sérénité)."
            - listitem [ref=f1e154]:
              - heading "Et la réservation en ligne ?" [level=3] [ref=f1e155]
              - paragraph [ref=f1e156]: J’intègre votre outil existant (lien ou widget Planity) ou je mets en place Cal.com/Calendly, directement dans le site.
            - listitem [ref=f1e157]:
              - heading "Où est hébergé le site ?" [level=3] [ref=f1e158]
              - paragraph [ref=f1e159]: Sur Vercel (équipe Pro). Le site et le nom de domaine vous appartiennent. Les frais tiers (domaine, Planity, Cal.com…) sont à votre nom.
            - listitem [ref=f1e160]:
              - heading "Pourquoi payer plus qu’un Wix ?" [level=3] [ref=f1e161]
              - paragraph [ref=f1e162]: Pas d’abonnement à vie, de meilleures performances, pas d’extensions à risque, un design vraiment à votre image et l’aide d’un interlocuteur unique, sur place.
        - region [ref=f1e163]:
          - heading "De l’idée à la mise en ligne." [level=2] [ref=f1e165]
          - list [ref=f1e166]:
            - listitem [ref=f1e167]:
              - generic [ref=f1e168]: "01"
              - generic [ref=f1e169]:
                - heading "On parle de votre projet" [level=3] [ref=f1e170]
                - paragraph [ref=f1e171]: Vous me présentez votre activité, vos envies et ce que vous souhaitez améliorer. On définit ensemble les priorités, le budget et les contours du projet.
            - listitem [ref=f1e172]:
              - generic [ref=f1e173]: "02"
              - generic [ref=f1e174]:
                - heading "Je donne forme aux idées" [level=3] [ref=f1e175]
                - paragraph [ref=f1e176]: Je vous propose une direction visuelle et, pour un site, une organisation des pages. On échange sur ces premières pistes pour valider les bases avant d’aller plus loin.
            - listitem [ref=f1e177]:
              - generic [ref=f1e178]: "03"
              - generic [ref=f1e179]:
                - heading "Le projet prend vie" [level=3] [ref=f1e180]
                - paragraph [ref=f1e181]: Je crée les supports ou développe le site à partir de la direction validée. Vous suivez les avancées et on planifie des retours pour affiner le résultat ensemble.
            - listitem [ref=f1e182]:
              - generic [ref=f1e183]: "04"
              - generic [ref=f1e184]:
                - heading "À toi de le faire vivre" [level=3] [ref=f1e185]
                - paragraph [ref=f1e186]: Je vous remets les fichiers, mets votre site en ligne et vous explique comment utiliser ce qui a été prévu pour vous. On peut ensuite poursuivre avec un accompagnement adapté à vos besoins.
