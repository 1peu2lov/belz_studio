            - paragraph [ref=e157]: Les indépendants et les petites entreprises portent des projets qui méritent d’être connus. Mon envie, c’est de leur donner les moyens de se démarquer, avec une identité qui leur ressemble et un site qui donne envie de découvrir ce qu’ils font. Belz Studio, c’est là que je réunis le design et le développement pour donner forme à ces ambitions. Des projets pensés ensemble, adaptés à tes moyens et à ce que tu veux construire.
            - paragraph [ref=e158]: "Basé à Bordeaux, je t’accompagne ici ou à distance, avec la même envie : créer quelque chose dont tu seras fier et qui aidera ton activité à grandir."
